<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starome - Chill your browser starting page out</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #4A90E2, #7BB8F0, #5BA0D0);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            transition: background 2s ease;
        }

        body.sunrise {
            background: linear-gradient(135deg, #FF6B6B, #FFE66D, #FF8E53);
            transition: background 2s ease;
        }

        body.day {
            background: linear-gradient(135deg, #4A90E2, #7BB8F0, #5BA0D0);
            transition: background 2s ease;
        }

        body.sunset {
            background: linear-gradient(135deg, #4A90E2, #FF6B35, #F7931E);
            transition: background 2s ease;
        }

        body.night {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            transition: background 2s ease;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        .weather-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .cloud {
            position: absolute;
            opacity: 0.3;
            animation: float 60s infinite ease-in-out;
        }

        .star {
            position: absolute;
            color: white;
            animation: twinkle 3s infinite ease-in-out;
        }

        .sun {
            position: absolute;
            top: 50px;
            right: 50px;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #ffeb3b, #ff9800);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(255, 235, 59, 0.5);
            animation: sunGlow 4s infinite ease-in-out;
        }

        .sunrise-sun {
            background: radial-gradient(circle, #FFE66D, #FF6B6B);
            box-shadow: 0 0 30px rgba(255, 230, 109, 0.4);
            width: 60px;
            height: 60px;
        }

        .moon {
            position: absolute;
            top: 50px;
            right: 50px;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #e3f2fd, #90caf9);
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(144, 202, 249, 0.5);
            animation: moonGlow 4s infinite ease-in-out;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* Welcome Section */
        .welcome-section {
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease-out;
        }

        .welcome-title {
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #e0e7ff, #c7d2fe);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
            letter-spacing: -0.02em;
            margin-bottom: 20px;
            animation: textGlow 3s ease-in-out infinite alternate;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .welcome-title:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }

        body.sunrise .welcome-title,
        body.sunset .welcome-title {
            background: linear-gradient(135deg, #2c3e50, #34495e, #2c3e50);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        body.night .welcome-title {
            background: linear-gradient(135deg, #ffffff, #e0e7ff, #c7d2fe);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .time-display {
            margin-top: 10px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .time {
            font-size: 2.5rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 5px;
            font-variant-numeric: tabular-nums;
        }

        .date {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 400;
        }

        body.sunrise .time,
        body.sunset .time {
            color: rgba(44, 62, 80, 0.9);
        }

        body.sunrise .date,
        body.sunset .date {
            color: rgba(44, 62, 80, 0.6);
        }

        /* Search Section */
        .search-section {
            margin-bottom: 60px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .search-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .search-form {
            width: 100%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-input-wrapper {
            position: relative;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            padding: 16px 24px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .search-input-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.6s ease;
        }

        .search-input-wrapper:hover::before {
            left: 100%;
        }

        .search-input-wrapper:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 
                0 12px 40px rgba(0, 0, 0, 0.3),
                0 0 60px rgba(120, 119, 198, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
            transition: all 0.3s ease;
        }

        body.sunrise .search-icon,
        body.sunset .search-icon {
            color: rgba(44, 62, 80, 0.6);
        }

        .search-input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 1.1rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.95);
            background: transparent;
            padding-left: 40px;
            transition: all 0.3s ease;
        }

        body.sunrise .search-input,
        body.sunset .search-input {
            color: rgba(44, 62, 80, 0.95);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
        }

        body.sunrise .search-input::placeholder,
        body.sunset .search-input::placeholder {
            color: rgba(44, 62, 80, 0.5);
        }

        .search-input:focus {
            color: white;
        }

        .search-input:focus + .search-icon {
            color: #ffffff;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.5));
        }

        /* Google Search - Default Large */
        .google-search {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .google-search .search-input-wrapper {
            padding: 20px 28px;
        }

        .google-search .search-input {
            font-size: 1.25rem;
        }

        .google-search .search-icon {
            width: 24px;
            height: 24px;
            left: 24px;
        }

        /* Google search becomes small when Bing is hovered/focused */
        .bing-search:hover ~ .google-search,
        .bing-search:focus-within ~ .google-search {
            opacity: 0.8;
            transform: scale(0.9);
        }

        .bing-search:hover ~ .google-search .search-input-wrapper,
        .bing-search:focus-within ~ .google-search .search-input-wrapper {
            padding: 12px 20px;
        }

        .bing-search:hover ~ .google-search .search-input,
        .bing-search:focus-within ~ .google-search .search-input {
            font-size: 0.95rem;
        }

        .bing-search:hover ~ .google-search .search-icon,
        .bing-search:focus-within ~ .google-search .search-icon {
            width: 16px;
            height: 16px;
            left: 18px;
        }

        /* Bing Search - Default Small, grows on hover */
        .bing-search {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bing-search .search-input-wrapper {
            padding: 12px 20px;
            opacity: 0.8;
            transform: scale(0.9);
        }

        .bing-search .search-input {
            font-size: 0.95rem;
        }

        .bing-search .search-icon {
            width: 16px;
            height: 16px;
            left: 18px;
        }

        .bing-search:hover .search-input-wrapper,
        .bing-search:focus-within .search-input-wrapper {
            padding: 20px 28px;
            opacity: 1;
            transform: scale(1);
        }

        .bing-search:hover .search-input,
        .bing-search:focus-within .search-input {
            font-size: 1.25rem;
        }

        .bing-search:hover .search-icon,
        .bing-search:focus-within .search-icon {
            width: 24px;
            height: 24px;
            left: 24px;
        }

        /* Search interaction - additional JavaScript-based styles */
        .search-form.dimmed {
            opacity: 0.4 !important;
            transform: scale(0.95) !important;
        }

        /* URL Entry Section */
        .url-entry-section {
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }

        .url-container {
            display: flex;
            justify-content: center;
        }

        .url-form {
            width: 100%;
            max-width: 600px;
        }

        .url-input-wrapper {
            position: relative;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            padding: 10px 20px;
            box-shadow: 
                0 6px 24px rgba(0, 0, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .url-input-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .url-input-wrapper:hover::before {
            left: 100%;
        }

        .url-input-wrapper:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.25),
                0 0 40px rgba(120, 119, 198, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .url-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
            transition: all 0.3s ease;
        }

        body.sunrise .url-icon,
        body.sunset .url-icon {
            color: rgba(44, 62, 80, 0.6);
        }

        .url-input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 1rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.95);
            background: transparent;
            padding-left: 40px;
            transition: all 0.3s ease;
        }

        body.sunrise .url-input,
        body.sunset .url-input {
            color: rgba(44, 62, 80, 0.95);
        }

        .url-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
        }

        body.sunrise .url-input::placeholder,
        body.sunset .url-input::placeholder {
            color: rgba(44, 62, 80, 0.5);
        }

        .url-input:focus {
            color: white;
        }

        .url-input:focus + .url-icon {
            color: #ffffff;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.4));
        }

        /* Shortcuts Section */
        .shortcuts-section {
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .shortcuts-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-width: 400px;
            margin: 0 auto;
        }

        .shortcut-item {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px 8px;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.9);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 4px 20px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            width: 80px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: shortcutFloat 4s ease-in-out infinite;
            animation-delay: var(--delay, 0s);
        }

        .shortcut-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #7877c6, #ff77c6, #78dbff);
            transform: scaleX(0);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: left;
        }

        .shortcut-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.6s ease;
        }

        .shortcut-item:hover {
            transform: translateY(-6px) scale(1.05);
            box-shadow: 
                0 12px 40px rgba(0, 0, 0, 0.2),
                0 0 60px rgba(120, 119, 198, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .shortcut-item:hover::before {
            transform: scaleX(1);
        }

        .shortcut-item:hover::after {
            left: 100%;
        }

        .shortcut-icon {
            width: 32px;
            height: 32px;
            margin-bottom: 6px;
            border-radius: 10px;
            background: linear-gradient(135deg, #7877c6, #ff77c6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(120, 119, 198, 0.3);
            transition: all 0.3s ease;
            overflow: hidden;
            animation: iconPulse 3s ease-in-out infinite;
        }

        .shortcut-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
        }

        .shortcut-item:hover .shortcut-icon {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 6px 20px rgba(120, 119, 198, 0.5);
        }

        .shortcut-name {
            font-size: 0.7rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.3s ease;
            max-width: 100%;
        }

        .shortcut-item:hover .shortcut-name {
            color: white;
        }

        .shortcut-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border: none;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .shortcut-item:hover .shortcut-remove {
            display: flex;
        }

        .shortcut-remove:hover {
            background: rgba(220, 38, 38, 1);
            transform: scale(1.1);
        }

        /* Add Shortcut Button */
        .add-shortcut-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.2),
                0 0 60px rgba(120, 119, 198, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            color: rgba(255, 255, 255, 0.9);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeInUp 0.8s ease-out 0.6s both, pulse 2s ease-in-out infinite;
        }

        .add-shortcut-btn:hover {
            transform: translateY(-6px) scale(1.1) rotate(90deg);
            box-shadow: 
                0 12px 40px rgba(0, 0, 0, 0.3),
                0 0 80px rgba(120, 119, 198, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
            color: white;
        }

        .add-shortcut-btn:active {
            transform: translateY(-2px) scale(1.05);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 32px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease;
        }

        .modal-content h3 {
            margin-bottom: 24px;
            color: #1f2937;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #4b5563;
            font-weight: 500;
            font-size: 0.875rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .btn-cancel, .btn-add {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.875rem;
        }

        .btn-cancel {
            background: #f3f4f6;
            color: #6b7280;
        }

        .btn-cancel:hover {
            background: #e5e7eb;
        }

        .btn-add {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-add:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        /* Animations */
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 0%, 100% 100%, 50% 50%, 0% 0%; }
            25% { background-position: 100% 0%, 0% 100%, 75% 25%, 0% 0%; }
            50% { background-position: 100% 100%, 0% 0%, 25% 75%, 0% 0%; }
            75% { background-position: 0% 100%, 100% 0%, 75% 25%, 0% 0%; }
        }

        @keyframes backgroundFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(-20px, -20px) rotate(1deg); }
            66% { transform: translate(20px, -10px) rotate(-1deg); }
        }

        @keyframes sparkle {
            0%, 100% { 
                background-position: 0% 0%, 30% 30%, 70% 70%;
                opacity: 0.8;
            }
            50% { 
                background-position: 100% 100%, 70% 70%, 30% 30%;
                opacity: 1;
            }
        }

        @keyframes containerFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes shortcutFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes float {
            0%, 100% { transform: translateX(0) translateY(0); }
            25% { transform: translateX(10px) translateY(-5px); }
            50% { transform: translateX(-5px) translateY(2px); }
            75% { transform: translateX(8px) translateY(-2px); }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        @keyframes sunGlow {

        @keyframes pulse {

        @keyframes textGlow {

        @keyframes glow {

        @keyframes confettiFall {

        /* Responsive Design */

            .shortcuts-grid {

<body>

        <section class="url-entry-section">

                            <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>

        <main class="search-section">

                <form class="search-form google-search" id="googleForm">

                        <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20">
                            <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>

                <form class="search-form bing-search" id="bingForm">
                    <div class="search-input-wrapper">

                            <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>

    <!-- Animated Background Elements -->
    <div class="weather-elements" id="weatherElements"></div>

    <!-- Easter Egg Modal -->
    <div class="easter-egg-modal" id="easterEggModal">
        <div class="easter-egg-content">
            <h2>Easter Egg Found!</h2>
            <p>Hello, I see you typed "HELLO"</p>
            <p>Doesn't do much, here's an easter egg!</p>

    <!-- Add Shortcut Modal -->
    <div class="modal" id="addShortcutModal">
        <div class="modal-content">
            <h3>Add Shortcut</h3>
            <form id="shortcutForm">
                <div class="form-group">
                    <label for="siteName">Site Name</label>
                    <input type="text" id="siteName" required>
                </div>
                <div class="form-group">
                    <label for="siteUrl">URL</label>
                    <input type="url" id="siteUrl" required placeholder="https://example.com">
                </div>
                <div class="modal-actions">

                    <button type="submit" class="btn-add">Add</button>
                </div>

    <script>
        class StartPage {
        constructor() {
            this.shortcuts = this.loadShortcuts();
            this.timeOverride = null;
            this.init();
        }

        init() {
            this.setupSearchBars();
            this.setupUrlEntry();
            this.setupShortcuts();
            this.setupModal();
            this.renderShortcuts();
            this.setupTimeDisplay();
            this.setupWeatherElements();
            this.setupDebugMenu();
            this.setupWelcomeTitle();
            this.setupEasterEgg();
        }

        setupSearchBars() {
            const googleForm = document.getElementById('googleForm');
            const bingForm = document.getElementById('bingForm');
            const googleInput = document.getElementById('googleInput');
            const bingInput = document.getElementById('bingInput');

            // Google search
            googleForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const query = googleInput.value.trim();
                if (query) {
                    window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
                }
            });

            // Bing search
            bingForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const query = bingInput.value.trim();
                if (query) {
                    window.location.href = `https://www.bing.com/search?q=${encodeURIComponent(query)}`;
                }
            });

            // Handle focus interactions between search bars
            googleInput.addEventListener('focus', () => {
                bingForm.classList.add('dimmed');
            });

            googleInput.addEventListener('blur', () => {
                if (!bingInput.matches(':focus')) {
                    bingForm.classList.remove('dimmed');
                }
            });

            bingInput.addEventListener('focus', () => {
                googleForm.classList.add('dimmed');
            });

            bingInput.addEventListener('blur', () => {
                if (!googleInput.matches(':focus')) {
                    googleForm.classList.remove('dimmed');
                }
            });

            // Handle hover interactions
            bingForm.addEventListener('mouseenter', () => {
                if (!googleInput.matches(':focus')) {
                    googleForm.classList.add('dimmed');
                }
            });

            bingForm.addEventListener('mouseleave', () => {
                if (!googleInput.matches(':focus')) {
                    googleForm.classList.remove('dimmed');
                }
            });

            googleForm.addEventListener('mouseenter', () => {
                if (!bingInput.matches(':focus')) {
                    bingForm.classList.add('dimmed');
                }
            });

            googleForm.addEventListener('mouseleave', () => {
                if (!bingInput.matches(':focus')) {
                    bingForm.classList.remove('dimmed');
                }
            });
        }

        setupUrlEntry() {
            const urlForm = document.getElementById('urlForm');
            const urlInput = document.getElementById('urlInput');

            // Handle URL form submission
            urlForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const url = urlInput.value.trim();
                
                if (url) {
                    // Ensure URL has protocol
                    let formattedUrl = url;
                    if (!url.startsWith('http://') && !url.startsWith('https://')) {
                        formattedUrl = 'https://' + url;
                    }
                    
                    // Navigate to the URL
                    window.location.href = formattedUrl;
                }
            });

            // Focus the URL input by default when page loads
            urlInput.focus();

            // Add keyboard shortcut to focus URL input (Ctrl/Cmd + L)
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'l') {
                    e.preventDefault();
                    urlInput.focus();
                    urlInput.select();
                }
            });
        }

        setupShortcuts() {
            const addBtn = document.getElementById('addShortcutBtn');
            const modal = document.getElementById('addShortcutModal');
            const cancelBtn = document.getElementById('cancelBtn');
            const shortcutForm = document.getElementById('shortcutForm');

            addBtn.addEventListener('click', () => {
                this.openModal();
            });

            cancelBtn.addEventListener('click', () => {
                this.closeModal();
            });

            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    this.closeModal();
                }
            });

            shortcutForm.addEventListener('submit', (e) => {
                e.preventDefault();
                this.addShortcut();
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modal.classList.contains('active')) {
                    this.closeModal();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    document.getElementById('googleInput').focus();
                }
            });
        }

        setupModal() {
            // Modal is already set up in setupShortcuts
        }

        openModal() {
            const modal = document.getElementById('addShortcutModal');
            const siteNameInput = document.getElementById('siteName');
            const siteUrlInput = document.getElementById('siteUrl');
            
            modal.classList.add('active');
            siteNameInput.value = '';
            siteUrlInput.value = '';
            siteNameInput.focus();
        }

        closeModal() {
            const modal = document.getElementById('addShortcutModal');
            modal.classList.remove('active');
        }

        addShortcut() {
            const siteNameInput = document.getElementById('siteName');
            const siteUrlInput = document.getElementById('siteUrl');
            
            const name = siteNameInput.value.trim();
            const url = siteUrlInput.value.trim();

            if (!name || !url) return;

            // Ensure URL has protocol
            let formattedUrl = url;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                formattedUrl = 'https://' + url;
            }

            const shortcut = {
                id: Date.now(),
                name: name,
                url: formattedUrl
            };

            this.shortcuts.push(shortcut);
            this.saveShortcuts();
            this.renderShortcuts();
            this.closeModal();
        }

        removeShortcut(id) {
            this.shortcuts = this.shortcuts.filter(shortcut => shortcut.id !== id);
            this.saveShortcuts();
            this.renderShortcuts();
        }

        renderShortcuts() {
            const grid = document.getElementById('shortcutsGrid');
            
            if (this.shortcuts.length === 0) {
                grid.innerHTML = '<p style="color: rgba(255,255,255,0.7); font-size: 0.9rem; grid-column: 1/-1;">No shortcuts yet. Click the + button to add some!</p>';
                return;
            }

            grid.innerHTML = this.shortcuts.map((shortcut, index) => `
                <div class="shortcut-item" data-id="${shortcut.id}" style="--delay: ${index * 0.2}s">
                    <button class="shortcut-remove" onclick="startPage.removeShortcut(${shortcut.id})">×</button>
                    <div class="shortcut-icon">
                        ${this.getShortcutIcon(shortcut)}
                    </div>
                    <div class="shortcut-name">${this.escapeHtml(shortcut.name)}</div>
                </div>
            `).join('');

            // Add click handlers to shortcuts
            grid.querySelectorAll('.shortcut-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('shortcut-remove')) {
                        const id = parseInt(item.dataset.id);
                        const shortcut = this.shortcuts.find(s => s.id === id);
                        if (shortcut) {
                            window.location.href = shortcut.url;
                        }
                    }
                });
            });
        }

        getShortcutIcon(shortcut) {
            // Try to use favicon first
            const faviconUrl = `https://www.google.com/s2/favicons?domain=${new URL(shortcut.url).hostname}&sz=64`;
            return `<img src="${faviconUrl}" alt="${shortcut.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><span style="display:none;">${this.getInitials(shortcut.name)}</span>`;
        }

        getInitials(name) {
            const words = name.trim().split(/\s+/);
            if (words.length === 1) {
                return words[0].substring(0, 2).toUpperCase();
            }
            return words.slice(0, 2).map(word => word[0]).join('').toUpperCase();
        }

        escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        saveShortcuts() {
            try {
                localStorage.setItem('chromeStartPageShortcuts', JSON.stringify(this.shortcuts));
            } catch (e) {
                console.warn('Could not save shortcuts to localStorage:', e);
            }
        }

        loadShortcuts() {
            try {
                const saved = localStorage.getItem('chromeStartPageShortcuts');
                return saved ? JSON.parse(saved) : this.getDefaultShortcuts();
            } catch (e) {
                console.warn('Could not load shortcuts from localStorage:', e);
                return this.getDefaultShortcuts();
            }
        }

        getDefaultShortcuts() {
            return [
                { id: 1, name: 'GitHub', url: 'https://github.com' },
                { id: 2, name: 'YouTube', url: 'https://youtube.com' },
                { id: 3, name: 'Twitter', url: 'https://twitter.com' },
                { id: 4, name: 'Reddit', url: 'https://reddit.com' }
            ];
        }

        setupTimeDisplay() {
            const updateTime = () => {
                const now = this.timeOverride ? new Date(this.timeOverride) : new Date();
                const timeElement = document.getElementById('currentTime');
                const dateElement = document.getElementById('currentDate');
                
                if (timeElement && dateElement) {
                    const time = now.toLocaleTimeString('en-US', { 
                        hour12: false, 
                        hour: '2-digit', 
                        minute: '2-digit', 
                        second: '2-digit' 
                    });
                    const date = now.toLocaleDateString('en-US', { 
                        weekday: 'long', 
                        year: 'numeric', 
                        month: 'long', 
                        day: 'numeric' 
                    });
                    
                    timeElement.textContent = time;
                    dateElement.textContent = date;
                }
            };

            updateTime();
            setInterval(updateTime, 1000);
        }

        setupWeatherElements() {
            const container = document.getElementById('weatherElements');
            const hour = this.timeOverride ? new Date(this.timeOverride).getHours() : new Date().getHours();
            
            // Determine time period and update body class
            let timeClass = '';
            let weatherMode = '';
            
            if (hour >= 5 && hour < 8) {
                // Sunrise (5:00 - 7:59)
                timeClass = 'sunrise';
                weatherMode = 'Sunrise';
            } else if (hour >= 8 && hour < 17) {
                // Day (8:00 - 16:59)
                timeClass = 'day';
                weatherMode = 'Day';
            } else if (hour >= 17 && hour < 20) {
                // Sunset (17:00 - 19:59)
                timeClass = 'sunset';
                weatherMode = 'Sunset';
            } else {
                // Night (20:00 - 4:59)
                timeClass = 'night';
                weatherMode = 'Night';
            }
            
            // Update body class for background transition
            document.body.className = timeClass;
            
            // Clear existing elements
            container.innerHTML = '';
            
            if (timeClass === 'sunrise') {
                this.createSun(container, true); // Soft sun for sunrise
                this.createClouds(container, 2);
            } else if (timeClass === 'day') {
                this.createSun(container, false); // Bright sun for day
                this.createClouds(container, 3);
            } else if (timeClass === 'sunset') {
                this.createSun(container, false); // Sun for sunset
                this.createClouds(container, 2);
            } else {
                // Night
                this.createMoon(container);
                this.createStars(container, 20);
                this.createClouds(container, 2);
            }
            
            // Update debug info
            if (document.getElementById('currentHour')) {
                document.getElementById('currentHour').textContent = hour + ':00';
            }
            if (document.getElementById('weatherMode')) {
                document.getElementById('weatherMode').textContent = weatherMode;
            }
        }

        createSun(container, isSunrise = false) {
            const sun = document.createElement('div');
            sun.className = isSunrise ? 'sun sunrise-sun' : 'sun';
            container.appendChild(sun);
        }

        createMoon(container) {
            const moon = document.createElement('div');
            moon.className = 'moon';
            container.appendChild(moon);
        }

        createClouds(container, count) {
            for (let i = 0; i < count; i++) {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';
                cloud.innerHTML = `
                    <svg width="100" height="60" viewBox="0 0 100 60" fill="rgba(255,255,255,0.3)">
                        <ellipse cx="25" cy="35" rx="20" ry="15"/>
                        <ellipse cx="45" cy="30" rx="25" ry="20"/>
                        <ellipse cx="70" cy="35" rx="20" ry="15"/>
                    </svg>
                `;
                cloud.style.left = Math.random() * 80 + '%';
                cloud.style.top = Math.random() * 60 + '%';
                cloud.style.animationDelay = Math.random() * 5 + 's';
                cloud.style.animationDuration = (40 + Math.random() * 20) + 's';
                container.appendChild(cloud);
            }
        }

        createStars(container, count) {
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.innerHTML = '<i class="fas fa-star"></i>';
                star.style.left = Math.random() * 90 + '%';
                star.style.top = Math.random() * 70 + '%';
                star.style.fontSize = (8 + Math.random() * 12) + 'px';
                star.style.animationDelay = Math.random() * 3 + 's';
                container.appendChild(star);
            }
        }

        setupDebugMenu() {
            const debugMenu = document.getElementById('debugMenu');
            const debugClose = document.getElementById('debugClose');
            const timeOverride = document.getElementById('timeOverride');
            const applyTimeOverride = document.getElementById('applyTimeOverride');
            const clearTimeOverride = document.getElementById('clearTimeOverride');
            const removeDebugMenu = document.getElementById('removeDebugMenu');
            const currentHourSpan = document.getElementById('currentHour');
            const weatherModeSpan = document.getElementById('weatherMode');

            // Return early if debug menu elements don't exist
            if (!debugMenu || !debugClose) {
                return;
            }

            const updateDebugInfo = () => {
                const hour = this.timeOverride ? new Date(this.timeOverride).getHours() : new Date().getHours();
                
                let weatherMode = '';
                if (hour >= 5 && hour < 8) {
                    weatherMode = 'Sunrise';
                } else if (hour >= 8 && hour < 17) {
                    weatherMode = 'Day';
                } else if (hour >= 17 && hour < 20) {
                    weatherMode = 'Sunset';
                } else {
                    weatherMode = 'Night';
                }
                
                if (document.getElementById('currentHour')) {
                    document.getElementById('currentHour').textContent = hour + ':00';
                }
                if (document.getElementById('weatherMode')) {
                    document.getElementById('weatherMode').textContent = weatherMode;
                }
            };

            debugClose.addEventListener('click', () => {
                debugMenu.style.display = 'none';
            });

            if (applyTimeOverride) {
                applyTimeOverride.addEventListener('click', () => {
                    const timeValue = timeOverride.value;
                    if (timeValue) {
                        const [hours, minutes] = timeValue.split(':').map(Number);
                        const now = new Date();
                        now.setHours(hours, minutes, 0, 0);
                        this.timeOverride = now.getTime();
                        this.setupTimeDisplay();
                        this.setupWeatherElements();
                        updateDebugInfo();
                    }
                });
            }

            if (clearTimeOverride) {
                clearTimeOverride.addEventListener('click', () => {
                    this.timeOverride = null;
                    if (timeOverride) timeOverride.value = '';
                    this.setupTimeDisplay();
                    this.setupWeatherElements();
                    updateDebugInfo();
                });
            }

            if (removeDebugMenu) {
                removeDebugMenu.addEventListener('click', () => {
                    debugMenu.remove();
                });
            }

            // Update debug info every second
            updateDebugInfo();
            setInterval(updateDebugInfo, 1000);
        }

        setupWelcomeTitle() {
            const welcomeTitle = document.querySelector('.welcome-title');
            const savedName = localStorage.getItem('userName');
            
            if (savedName) {
                welcomeTitle.textContent = `Welcome back, ${savedName}`;
            }
            
            welcomeTitle.addEventListener('click', () => {
                const newName = prompt('Enter your name:', savedName || 'Noah');
                if (newName && newName.trim()) {
                    const trimmedName = newName.trim();
                    localStorage.setItem('userName', trimmedName);
                    welcomeTitle.textContent = `Welcome back, ${trimmedName}`;
                }
            });
        }

        setupEasterEgg() {
            let helloBuffer = '';
            let helloTimeout;
            
            document.addEventListener('keypress', (e) => {
                helloBuffer += e.key.toLowerCase();
                
                if (helloBuffer.includes('hello')) {
                    this.showEasterEgg();
                    helloBuffer = '';
                    clearTimeout(helloTimeout);
                    return;
                }
                
                clearTimeout(helloTimeout);
                helloTimeout = setTimeout(() => {
                    helloBuffer = '';
                }, 2000);
            });
            
            // Close modal when clicking outside or on close button
            document.getElementById('eggCloseBtn').addEventListener('click', () => {
                this.hideEasterEgg();
            });
            
            document.getElementById('easterEggModal').addEventListener('click', (e) => {
                if (e.target.id === 'easterEggModal') {
                    this.hideEasterEgg();
                }
            });
        }

        showEasterEgg() {
            const modal = document.getElementById('easterEggModal');
            modal.classList.add('active');
            // Create confetti effect
            this.createConfetti();
        }

        hideEasterEgg() {
            const modal = document.getElementById('easterEggModal');
            modal.classList.remove('active');
            // Clean up confetti
            document.querySelectorAll('.confetti').forEach(c => c.remove());
        }

        createConfetti() {
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.innerHTML = ['🎉', '🎊', '✨', '🌟', '💫'][Math.floor(Math.random() * 5)];
                confetti.style.cssText = `
                    position: fixed;
                    top: ${Math.random() * 100}%;
                    left: ${Math.random() * 100}%;
                    font-size: ${Math.random() * 20 + 10}px;
                    animation: confettiFall 3s ease-out forwards;
                    z-index: 3000;
                    pointer-events: none;
                `;
                document.body.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 3000);
            }
        }
    }

    // Initialize the start page
    const startPage = new StartPage();

    // Add some interactive polish
    document.addEventListener('DOMContentLoaded', () => {

        // Add time-based greeting
        const updateGreeting = () => {
            const hour = new Date().getHours();
            const title = document.querySelector('.welcome-title');
            const savedName = localStorage.getItem('userName') || 'Noah';
            let greeting = 'Welcome back';
            
            if (hour < 12) greeting = 'Good morning';
            else if (hour < 17) greeting = 'Good afternoon';
            else greeting = 'Good evening';
            
            title.textContent = `${greeting}, ${savedName}`;
        };

        updateGreeting();
        // Update greeting every minute
        setInterval(updateGreeting, 60000);
    });

    </script>
</body>
</html>
